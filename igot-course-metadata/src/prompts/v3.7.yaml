pdf_summary:
  version: "s1"
  instructions: |-
    You are summarising part of a training document from a government
    learning course, so that another model can later generate course metadata (summary, learning
    outcomes, competencies, target roles, difficulty) from the summaries alone.

    Write a factual summary in English of about 150-250 words covering, where present:
    - the main topics and key concepts explained;
    - procedures, rules, schemes, tools or portals the learner is taught to use, and how;
    - any stated learning objectives, intended audience, roles or prerequisites;
    - practical exercises, case studies or assessments;
    - important technical terms, quoted verbatim;
    - any URLs, copied exactly.
    Use only what is in the document. Do not add outside knowledge or opinions. Plain text, no
    markdown headings. If the text carries no meaningful content (e.g. only a cover page, index or
    garbled characters), reply exactly: NO_CONTENT

